<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .nav-header {
            background: linear-gradient(145deg, #8b4513, #6d360f);
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 0 rgba(139, 69, 19, 0.3);
        }

        .nav-header h1 {
            color: #f8f0e6;
            font-size: 1.8em;
            margin: 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a {
            color: #f8f0e6;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            transition: all 0.2s ease;
            font-weight: bold;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }

        .nav-links a.active {
            background: rgba(255,255,255,0.25);
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-header">
            <h1>Tic-Tac-Toe</h1>
            <div class="nav-links">
                <a href="/index.html">Voice Game</a>
            </div>
        </div>
        
        <div class="status" id="status">
            Loading game...
        </div>
        
        <div class="game-board" id="game-board">
            <!-- Cells will be generated by JavaScript -->
        </div>
        
        <button id="new-game-btn" class="new-game-btn">New Game</button>
    </div>
    
    <script>
        (function() {
            var ts = Date.now();
            document.querySelectorAll('script[src]').forEach(function(s) {
                var src = s.src.split('?')[0]; // strip old query string
                s.src = src + '?v=' + ts;
            });
            document.querySelectorAll('link[rel="stylesheet"]').forEach(function(l) {
                var href = l.href.split('?')[0];
                l.href = href + '?v=' + ts;
            });
        })();
    </script>
    <script src="/static/app.js"></script>
</body>
</html>
