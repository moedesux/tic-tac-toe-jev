# Voice Configuration for Tic-Tac-Toe Game
# Voice game settings are defined in voice_game_config.py
# Infrastructure settings (SLM, ASR, TTS) remain here

# SLM Server Configuration
[slm]
host = localhost
port = 8080
api_key = your_api_key_here
model_path = ./models/gemma-4-e4b-it-tictactoe-finetune.Q4_K_M.gguf
model_name = moe249/google_gemma-4-E4B-it-tictactoe

# ASR (Automatic Speech Recognition) Configuration
[asr]
model_path = ./models/Qwen3-ASR-0.6B

# TTS (Text-to-Speech) Configuration
[tts]
enabled = true
model_path = ./models/kokoro-v1.0.onnx
voices_path = ./models/voices-v1.0.bin
voice = af_sarah
speed = 1.0
lang = en-us
sample_rate = 24000

# API Gateway Configuration
[api_gateway]
base_url = http://localhost:8002

# Backend Server Configuration
[backend]
host = 0.0.0.0
port = 8002

# Debug Settings
[debug]
enabled = false
